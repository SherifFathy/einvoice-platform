<h2>Edit Company</h2>

@if (loading) {
  <p>Loading...</p>
} @else {
  <mat-card>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <mat-form-field>
          <mat-label>Name (Arabic)</mat-label>
          <input matInput formControlName="nameAr" required />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Name (English)</mat-label>
          <input matInput formControlName="nameEn" required />
        </mat-form-field>
        <mat-form-field>
          <mat-label>VAT Number</mat-label>
          <input matInput formControlName="vatNumber" required />
        </mat-form-field>
        <mat-form-field>
          <mat-label>CR Number</mat-label>
          <input matInput formControlName="crNumber" />
        </mat-form-field>
      </div>
      <div class="form-actions">
        <button mat-button type="button" routerLink="/config/company-create">Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="submitting">
          @if (submitting) { Saving... } @else { Save Changes }
        </button>
      </div>
    </form>
  </mat-card>
}
