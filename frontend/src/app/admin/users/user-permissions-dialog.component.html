<h2 mat-dialog-title>Permissions: {{ user.name }}</h2>

<mat-dialog-content>
  <div class="company-selector">
    <mat-form-field>
      <mat-label>Company</mat-label>
      <mat-select [(ngModel)]="selectedCompanyId" (ngModelChange)="loadPermissions()">
        @for (c of companies; track c.companyId) {
          <mat-option [value]="c.companyId">{{ c.companyName }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  <div class="context-selector">
    <mat-form-field>
      <mat-label>LOV Context</mat-label>
      <mat-select [(ngModel)]="selectedLovContextId" (ngModelChange)="loadPermissions()">
        @for (ctx of lovContexts; track ctx.id) {
          <mat-option [value]="ctx.id">{{ ctx.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  @if (loading) {
    <p>Loading permissions...</p>
  } @else {
    <div>
      <button mat-stroked-button (click)="selectAll()" style="margin-right: 8px;">Select All</button>
      <button mat-stroked-button (click)="selectNone()">Select None</button>
    </div>
    <div class="perm-grid">
      @for (perm of allPermissions; track perm) {
        <mat-checkbox [checked]="selected.has(perm)" (change)="toggle(perm)">
          {{ perm }}
        </mat-checkbox>
      }
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions" align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="submitting">
    @if (submitting) { Saving... } @else { Save Permissions }
  </button>
</mat-dialog-actions>
