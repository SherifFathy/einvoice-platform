<h2>User Management</h2>

<div class="toolbar">
  <button mat-raised-button color="primary" (click)="openCreateDialog()">
    <mat-icon>person_add</mat-icon> Create User
  </button>
  <mat-slide-toggle [checked]="includeInactive" (change)="onIncludeInactiveToggle()">
    Show Inactive
  </mat-slide-toggle>
</div>

@if (loading) {
  <p>Loading users...</p>
} @else {
  <table mat-table [dataSource]="users">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let user">{{ user.name }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let user">{{ user.email }}</td>
    </ng-container>

    <ng-container matColumnDef="isSuperUser">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let user">
        @if (user.isSuperUser) {
          <span class="super-badge">Super User</span>
        } @else {
          <span>Standard</span>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let user">
        <span [class.active-badge]="user.isActive" [class.inactive-badge]="!user.isActive">
          {{ user.isActive ? 'Active' : 'Inactive' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let user">
        <div class="actions">
          <button mat-icon-button color="primary" (click)="openEditDialog(user)" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button
                  [color]="user.isActive ? 'warn' : 'primary'"
                  (click)="toggleActive(user)"
                  [matTooltip]="user.isActive ? 'Deactivate' : 'Activate'">
            <mat-icon>{{ user.isActive ? 'person_off' : 'person' }}</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  @if (users.length === 0) {
    <p style="text-align: center; color: #999; margin-top: 24px;">No users found.</p>
  }
}
