<mat-form-field *ngIf="showSearch" appearance="outline" class="search-field">
  <mat-label>{{ searchPlaceholder }}</mat-label>
  <input matInput [(ngModel)]="searchValue" (ngModelChange)="onSearchDebounced()" />
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

<table mat-table [dataSource]="data" matSort (matSortChange)="onSortChange($event)">
  <ng-container *ngFor="let column of columns" [matColumnDef]="column.field">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ column.header }}</th>
    <td mat-cell *matCellDef="let element">
      <ng-container *ngIf="column.type === 'boolean'; else defaultCell">
        {{ element[column.field] ? 'Yes' : 'No' }}
      </ng-container>
      <ng-template #defaultCell>
        {{ element[column.field] }}
      </ng-template>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="onRowClick(row)"></tr>
</table>

<mat-paginator
  [length]="totalElements"
  [pageSize]="pageSize"
  [pageIndex]="pageIndex"
  (page)="onPageChange($event)"
></mat-paginator>
