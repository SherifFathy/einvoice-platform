<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>E-Invoice Platform</mat-card-title>
      <mat-card-subtitle>Sign in to your account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Authority</mat-label>
          <mat-select formControlName="authority">
            <mat-option *ngFor="let opt of authorityOptions" [value]="opt.value">{{ opt.label }}</mat-option>
          </mat-select>
          <mat-error *ngIf="form.get('authority')?.hasError('required')">Authority is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Document Type</mat-label>
          <mat-select formControlName="docType">
            <mat-option *ngFor="let opt of docTypeOptions" [value]="opt.value">{{ opt.label }}</mat-option>
          </mat-select>
          <mat-error *ngIf="form.get('docType')?.hasError('required')">Document type is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Sub-Environment</mat-label>
          <mat-select formControlName="subEnvironment">
            <mat-option *ngFor="let opt of subEnvOptions" [value]="opt.value">{{ opt.label }}</mat-option>
          </mat-select>
          <mat-error *ngIf="form.get('subEnvironment')?.hasError('required')">Sub-environment is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Enter a valid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required</mat-error>
        </mat-form-field>

        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width login-button"
          [disabled]="form.invalid || !authorityValue || !docTypeValue || !subEnvValue || submitting"
        >
          <mat-spinner *ngIf="submitting" diameter="20"></mat-spinner>
          <span *ngIf="!submitting">Sign In</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
