<mat-card class="login-card">
  <mat-card-header>
    <mat-card-title>Global E-Invoicing Gateway</mat-card-title>
    <mat-card-subtitle>Sign in to your account</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
        <mat-error *ngIf="form.get('email')?.hasError('email')">Enter a valid email</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
        <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Authority</mat-label>
        <mat-select formControlName="authority">
          <mat-option *ngFor="let opt of authorityOptions" [value]="opt.value">{{ opt.label }}</mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('authority')?.hasError('required')">Authority is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Environment</mat-label>
        <mat-select formControlName="environment">
          <mat-option *ngFor="let env of environmentOptions" [value]="env.environment">{{ env.label }}</mat-option>
        </mat-select>
        <mat-spinner matSuffix *ngIf="loadingEnvironments" diameter="16"></mat-spinner>
        <mat-error *ngIf="form.get('environment')?.hasError('required')">Environment is required</mat-error>
        <mat-hint *ngIf="!loadingEnvironments && form.get('authority')?.value && environmentOptions.length === 0">
          No environments configured for this authority
        </mat-hint>
      </mat-form-field>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        class="full-width login-button"
        [disabled]="loginDisabled"
      >
        <mat-spinner *ngIf="submitting" diameter="20"></mat-spinner>
        <span *ngIf="!submitting">Sign In</span>
      </button>
    </form>
  </mat-card-content>
</mat-card>
