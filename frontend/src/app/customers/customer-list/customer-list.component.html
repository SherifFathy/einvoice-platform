<div class="toolbar">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search</mat-label>
    <input matInput [(ngModel)]="searchValue" (ngModelChange)="onSearch()" placeholder="Name or VAT...">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>
  <mat-form-field appearance="outline" class="filter-select">
    <mat-label>Type</mat-label>
    <mat-select [(ngModel)]="typeFilter" (selectionChange)="onTypeFilterChange()">
      <mat-option value="">All</mat-option>
      <mat-option value="B2B">B2B</mat-option>
      <mat-option value="B2C">B2C</mat-option>
    </mat-select>
  </mat-form-field>
  <span class="spacer"></span>
  <button mat-stroked-button (click)="downloadTemplate()">
    <mat-icon>download</mat-icon> Template
  </button>
  <button mat-stroked-button (click)="importCustomers.emit()">
    <mat-icon>upload</mat-icon> Import
  </button>
  <button mat-raised-button color="primary" (click)="editCustomer.emit(null!)" *appHasPermission="'CREATE_CUSTOMER'">
    <mat-icon>add</mat-icon> New Customer
  </button>
</div>

<table mat-table [dataSource]="customers">
  <ng-container matColumnDef="nameEn">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let c">{{ c.nameEn }}</td>
  </ng-container>
  <ng-container matColumnDef="nameAr">
    <th mat-header-cell *matHeaderCellDef>Name (Ar)</th>
    <td mat-cell *matCellDef="let c">{{ c.nameAr }}</td>
  </ng-container>
  <ng-container matColumnDef="vatNumber">
    <th mat-header-cell *matHeaderCellDef>VAT Number</th>
    <td mat-cell *matCellDef="let c">{{ c.vatNumber }}</td>
  </ng-container>
  <ng-container matColumnDef="customerType">
    <th mat-header-cell *matHeaderCellDef>Type</th>
    <td mat-cell *matCellDef="let c">{{ c.customerType }}</td>
  </ng-container>
  <ng-container matColumnDef="contactEmail">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let c">{{ c.contactEmail }}</td>
  </ng-container>
  <ng-container matColumnDef="isActive">
    <th mat-header-cell *matHeaderCellDef>Active</th>
    <td mat-cell *matCellDef="let c">
      <span [style.color]="c.isActive ? 'green' : 'red'">{{ c.isActive ? 'Yes' : 'No' }}</span>
    </td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let c">
      <div class="actions">
        <button mat-icon-button (click)="onEdit(c)" *appHasPermission="'EDIT_CUSTOMER'"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="onDelete(c)" *appHasPermission="'DELETE_CUSTOMER'"><mat-icon>delete</mat-icon></button>
      </div>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator [length]="totalElements" [pageSize]="pageSize" [pageIndex]="pageIndex"
    (page)="onPageChange($event)"></mat-paginator>
