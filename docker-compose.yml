services:
  postgres:
    image: postgres:16
    container_name: einvoice-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: einvoice
      POSTGRES_USER: einvoice
      POSTGRES_PASSWORD: einvoice_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U einvoice"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: einvoice-pgadmin
    profiles:
      - tools
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@einvoice.local
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
