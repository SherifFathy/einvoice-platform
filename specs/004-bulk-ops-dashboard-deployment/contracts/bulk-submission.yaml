openapi: 3.0.3
info:
  title: Bulk Invoice Submission API
  version: 1.0.0
  description: >
    Wave 3 endpoints for foreground (SSE-streamed) and background bulk invoice
    submission. Both share the same request body; the foreground variant streams
    per-invoice progress events as `text/event-stream`, the background variant
    enqueues a Job and returns immediately.

servers:
  - url: /api

paths:
  /invoices/bulk-submit:
    post:
      summary: Submit a set of invoices in the foreground with streamed progress
      description: >
        Streams Server-Sent Events (`text/event-stream`). Emits one `progress`
        event per invoice and a final `summary` event. The caller is expected
        to keep the connection open for the duration.
      operationId: bulkSubmitForeground
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkSubmitRequest'
      responses:
        '200':
          description: SSE stream of per-invoice progress events
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/BulkProgressStream'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: One or more invoices are not in READY_FOR_SUBMISSION state

  /jobs/bulk-submit:
    post:
      summary: Enqueue a background bulk submission job
      operationId: bulkSubmitBackground
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkSubmitRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
          headers:
            Location:
              schema: { type: string }
              description: Relative URL of the created job
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    BulkSubmitRequest:
      type: object
      required: [invoiceIds]
      properties:
        invoiceIds:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: string
            format: uuid
        note:
          type: string
          maxLength: 500
          description: Optional note recorded on the job for traceability

    BulkProgressStream:
      type: object
      description: >
        Conceptual schema for the SSE stream; actual transport is one event per
        line per the SSE spec. Event `progress` has a body matching
        `ProgressEvent`; event `summary` has a body matching `JobSummary`.
      properties:
        progress:
          $ref: '#/components/schemas/ProgressEvent'
        summary:
          $ref: '#/components/schemas/JobSummary'

    ProgressEvent:
      type: object
      required: [invoiceId, status, sequenceIndex]
      properties:
        invoiceId: { type: string, format: uuid }
        sequenceIndex: { type: integer, minimum: 0 }
        status:
          type: string
          enum: [IN_PROGRESS, SUCCEEDED, FAILED, SKIPPED]
        errorSummary:
          type: string
          nullable: true

    JobSummary:
      type: object
      required: [totalCount, successCount, failedCount, skippedCount]
      properties:
        jobId: { type: string, format: uuid, nullable: true, description: Present for background mode; omitted for foreground }
        totalCount: { type: integer }
        successCount: { type: integer }
        failedCount: { type: integer }
        skippedCount: { type: integer }

    JobAcceptedResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED] }
        totalCount: { type: integer }

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: array
          items: { type: string }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Caller lacks the required role or environment permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
