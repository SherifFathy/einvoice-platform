openapi: 3.1.0
info:
  title: Wave 8 — ZATCA Standard (B2B) API
  version: "1.0.0"
  description: |
    REST contract for ZATCA Standard tax document management (B2B, clearance flow).

    **Authentication**: every request requires a bearer JWT. The JWT carries
    `companyId` and `authorityEnvironmentId` (Wave 5). The platform refuses any
    request whose `companyId` JWT claim does not match the `{id}` path parameter
    (cross-company access is denied with `403 Forbidden`).

    **Tenant scope**: every endpoint operates within the
    `(companyId, authorityEnvironmentId)` tuple resolved from the JWT.
    `authorityEnvironmentId` is **never** on the wire (Constitution III.3,
    spec FR-024).

    **Optimistic concurrency** (spec FR-032): `GET` responses include a strong
    `ETag` header derived from the `version` field. `PUT` requires `If-Match`;
    a stale `If-Match` returns `409 Conflict` with the full current document
    body to drive the conflict-resolution UI.

    **Chain integrity** (spec FR-009, FR-010, Q2): `POST /submit` may return
    `503 CHAIN_BUSY` when the pessimistic lock on `zatca_chain_state` is not
    acquired within ~30 s — the document is left in `DRAFT`, the chain counter
    is not advanced, and a retry is safe. On any submission that reaches ZATCA
    (including rejections), the chain counter advances by exactly one.
servers:
  - url: /api/companies/{id}
    variables:
      id:
        default: "00000000-0000-0000-0000-000000000000"
        description: Active company UUID; must match the JWT companyId claim.

tags:
  - name: standard
  - name: lifecycle
  - name: artifacts

paths:
  /zatca/standard:
    get:
      tags: [standard]
      summary: List ZATCA Standard documents visible to the user in the active environment
      description: |
        Returns documents across **all** companies the user is assigned to for the
        active `authorityEnvironmentId` (Constitution VIII.5, spec FR-029). The
        `companyId` path parameter scopes only authorisation; the result set is
        not filtered to that one company unless the `company` query parameter is
        supplied.
      parameters:
        - { name: company,  in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status,   in: query, required: false, schema: { $ref: '#/components/schemas/DocumentState' } }
        - { name: dateFrom, in: query, required: false, schema: { type: string, format: date } }
        - { name: dateTo,   in: query, required: false, schema: { type: string, format: date } }
        - { name: page,     in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size,     in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        "200":
          description: Paged list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedStandardList' }
        "403":
          description: User is not assigned to the active company
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    post:
      tags: [standard]
      summary: Create a new draft Standard document
      description: |
        Creates the document in `DRAFT` state. Requires `STANDARD.CREATE`
        permission. Validates: buyer-required (FR-008), VAT-exemption-reason
        (FR-004), totals consistency (FR-031), original-class compatibility
        for credit/debit notes (FR-030), document-number uniqueness (FR-006).
        No outbound call to ZATCA is made here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrUpdateStandard' }
      responses:
        "201":
          description: Created
          headers:
            ETag:
              schema: { type: string }
              description: Strong ETag = `"<version>"` (FR-032).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Standard' }
        "400":
          description: Validation failure (e.g. `MISSING_BUYER_FOR_STANDARD`, `VAT_EXEMPTION_REASON_REQUIRED`, `MISSING_ORIGINAL_DOCUMENT`, `WRONG_ORIGINAL_CLASS`, `TOTALS_INCONSISTENT`)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "409":
          description: "`DUPLICATE_STANDARD_NUMBER`"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /zatca/standard/{docId}:
    parameters:
      - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [standard]
      summary: Get a Standard document with lines, chain snapshot, submission summary, and ZATCA response
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Standard' }
        "404":
          description: Not found (also returned to mask cross-environment access — FR-024)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    put:
      tags: [standard]
      summary: Update a draft Standard document (optimistic concurrency)
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
          description: The strong ETag returned from the previous `GET`. Stale value → `409 OPTIMISTIC_LOCK_CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrUpdateStandard' }
      responses:
        "200":
          description: Updated
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Standard' }
        "400":
          description: Validation failure
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "409":
          description: |
            One of:
            - `DOCUMENT_NOT_DRAFT` — document is no longer in DRAFT
            - `OPTIMISTIC_LOCK_CONFLICT` — If-Match stale; body carries both versions
            - `DUPLICATE_STANDARD_NUMBER` — invoice_number now conflicts
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Error' }
                  - { $ref: '#/components/schemas/ConflictBody' }
    delete:
      tags: [standard]
      summary: Delete a draft Standard document
      description: Only documents in `DRAFT` may be deleted (FR-007). Cascades to lines.
      responses:
        "204":
          description: Deleted
        "409":
          description: "`DOCUMENT_NOT_DRAFT`"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /zatca/standard/{docId}/clone-as-draft:
    parameters:
      - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [standard]
      summary: Clone a REJECTED Standard document into a new DRAFT (FR-007a, Q1)
      description: |
        Produces a new draft document, pre-populated from the source, with a new
        `invoice_number`. The source row is unchanged. Allowed for source rows
        in any status (typically REJECTED, but the platform does not constrain
        it — the value is in pre-population).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newInvoiceNumber]
              properties:
                newInvoiceNumber:
                  type: string
                  maxLength: 100
                  description: Must be unique per (company, authorityEnvironment) — FR-006.
      responses:
        "201":
          description: New draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Standard' }
        "409":
          description: "`DUPLICATE_STANDARD_NUMBER`"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /zatca/standard/{docId}/submit:
    parameters:
      - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [lifecycle]
      summary: Submit a draft Standard document to ZATCA clearance
      description: |
        Lifecycle: `DRAFT → SUBMITTING → ACCEPTED | REJECTED | IN_REVIEW`.

        Sequence (all within a single transaction up to the outbound call):
        1. Acquire `SELECT FOR UPDATE` on `zatca_chain_state` with
           `SET LOCAL lock_timeout = '30s'`. On timeout → `503 CHAIN_BUSY`
           (FR-009a, Q2).
        2. Increment `zatca_chain_state.invoice_counter`; capture new value
           and the previous `invoice_hash`.
        3. Build UBL 2.1 XML, sign (XAdES-BES), hash (SHA-256 of C14N11),
           generate QR TLV (Phase-2 9 tags).
        4. Persist chain snapshot fields on the document; insert
           `submission_attempts` row; persist artifacts (`UBL_XML`,
           `SIGNED_UBL_XML`, `QR_PNG`, `ZATCA_REQUEST`).
        5. Call `POST {zatca_configs.base_url}/invoices/clearance/single`.
        6. Persist response artifact (`ZATCA_RESPONSE`, optionally
           `CLEARED_XML`); finalise the submission_attempt row; update
           `clearance_status`, `zatca_response_data`, and `status`.

        Rejections still advance the chain counter (FR-010, Constitution XII.5).
      responses:
        "200":
          description: Submission completed (the body carries the outcome — including REJECTED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionOutcome' }
        "409":
          description: |
            One of:
            - `NO_CERTIFICATE_CONFIGURED`
            - `INVALID_LIFECYCLE_TRANSITION`
            - `TOTALS_INCONSISTENT`
            - `MISSING_BUYER_FOR_STANDARD`
            - `VAT_EXEMPTION_REASON_REQUIRED`
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "503":
          description: "`CHAIN_BUSY` — chain lock not acquired within ~30 s; document left in DRAFT; safe to retry"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /zatca/standard/{docId}/cancel:
    parameters:
      - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [lifecycle]
      summary: Cancel a previously ACCEPTED Standard document
      description: |
        Forwards the cancellation to ZATCA verbatim (FR-019). No platform-side
        time-window check. ZATCA's response is authoritative — accept or reject
        (including out-of-window rejection) is recorded against the document
        and reflected in `status`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: ZATCA processed the cancellation (body carries the outcome)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionOutcome' }
        "409":
          description: "`INVALID_LIFECYCLE_TRANSITION` — document is not in ACCEPTED"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /zatca/standard/{docId}/retry:
    parameters:
      - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [lifecycle]
      summary: Retry an ambiguous submission (FR-017)
      description: |
        Produces a new `submission_attempts` row against the same document. Does
        not re-advance the chain counter. Safe to call multiple times.
      responses:
        "200":
          description: Retry outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionOutcome' }
        "409":
          description: Document is not in an ambiguous state
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /zatca/standard/{docId}/check-status:
    parameters:
      - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [lifecycle]
      summary: Refresh the ZATCA-side status of a single document (FR-018)
      description: User-invoked. No background polling.
      responses:
        "200":
          description: Latest status from ZATCA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionOutcome' }

  /zatca/standard/check-status:
    post:
      tags: [lifecycle]
      summary: Bulk refresh ZATCA-side status (FR-018a, Q5)
      description: |
        Accepts an **unbounded** list of `documentIds`. Returns an NDJSON stream
        (`application/x-ndjson`) where each line is a `BulkStatusOutcome`. The
        server paces calls to stay within ZATCA's rate limits. A `Run-Id` is
        echoed as a response header; a follow-up `DELETE /api/runs/{runId}`
        cancels in-flight processing — already-issued ZATCA calls complete,
        not-yet-issued ones are reported with outcome `CANCELLED_NO_OP`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentIds]
              properties:
                documentIds:
                  type: array
                  items: { type: string, format: uuid }
                  description: Unbounded list per Q5; the platform rate-paces.
      responses:
        "200":
          description: NDJSON stream of per-document outcomes
          headers:
            Run-Id:
              schema: { type: string, format: uuid }
              description: Run identifier used to cancel mid-run.
          content:
            application/x-ndjson:
              schema:
                description: One JSON object per line
                $ref: '#/components/schemas/BulkStatusOutcome'

  /zatca/standard/{docId}/submissions:
    parameters:
      - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [artifacts]
      summary: List submission attempts for a document
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SubmissionAttempt' }

  /zatca/standard/{docId}/artifacts/{type}:
    parameters:
      - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum: [UBL_XML, SIGNED_UBL_XML, QR_PNG, CLEARED_XML, ZATCA_REQUEST, ZATCA_RESPONSE]
    get:
      tags: [artifacts]
      summary: Download a stored artifact (immutable, append-only — FR-021)
      responses:
        "200":
          description: Artifact payload (Content-Type set per artifact)
          content:
            application/xml:           { schema: { type: string, format: binary } }
            image/png:                 { schema: { type: string, format: binary } }
            application/json:          { schema: { type: string, format: binary } }
        "404":
          description: Artifact type not present for this document (e.g. CLEARED_XML for Simplified)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

components:
  schemas:
    DocumentState:
      type: string
      enum: [DRAFT, SUBMITTING, SUBMITTED, IN_REVIEW, ACCEPTED, REJECTED, CANCELLED]

    Error:
      type: object
      required: [code, message]
      properties:
        code:    { type: string, description: "Stable machine code (see error-codes.md)" }
        message: { type: string }
        details: { type: object, additionalProperties: true }

    ConflictBody:
      description: Body returned with `OPTIMISTIC_LOCK_CONFLICT` (FR-032)
      type: object
      required: [code, message, expectedVersion, actualVersion, current]
      properties:
        code:            { type: string, enum: [OPTIMISTIC_LOCK_CONFLICT] }
        message:         { type: string }
        expectedVersion: { type: integer, format: int64 }
        actualVersion:   { type: integer, format: int64 }
        current:         { $ref: '#/components/schemas/Standard' }

    Party:
      type: object
      description: UBL party (full structure stored in JSONB; this is the shape over the wire)
      required: [taxRegistrationNumber, partyName]
      properties:
        taxRegistrationNumber: { type: string }
        partyName:             { type: string }
        addressStreet:         { type: string }
        addressCityName:       { type: string }
        addressPostalZone:     { type: string }
        addressCountryCode:    { type: string, minLength: 2, maxLength: 2 }
        partyIdentificationId:    { type: string }
        partyIdentificationScheme: { type: string }

    StandardLine:
      type: object
      required: [lineNumber, description, quantity, unitPrice, vatCategoryCode]
      properties:
        id:                    { type: string, format: uuid, readOnly: true }
        lineNumber:            { type: integer, minimum: 1 }
        itemId:                { type: string, format: uuid }
        itemCode:              { type: string }
        description:           { type: string }
        unitType:              { type: string }
        quantity:              { type: number, multipleOf: 0.00001 }
        unitPrice:             { type: number, multipleOf: 0.00001 }
        lineExtensionAmount:   { type: number, multipleOf: 0.01 }
        discountAmount:        { type: number, multipleOf: 0.01 }
        allowanceAmount:       { type: number, multipleOf: 0.01 }
        netAmount:             { type: number, multipleOf: 0.01 }
        vatCategoryCode:       { type: string, enum: [S, Z, E, O] }
        vatRate:               { type: number }
        vatAmount:             { type: number, multipleOf: 0.01 }
        exemptionReasonCode:   { type: string }
        exemptionReasonText:   { type: string }

    CreateOrUpdateStandard:
      type: object
      required: [invoiceNumber, invoiceTypeCode, transactionTypeCode, issueDate, issueTime, sellerData, buyerData, lines]
      properties:
        invoiceNumber:       { type: string, maxLength: 100 }
        invoiceTypeCode:     { type: string, description: "388 standard / 381 credit / 383 debit" }
        transactionTypeCode: { type: string, description: "Must start with 01 for Standard" }
        issueDate:           { type: string, format: date }
        issueTime:           { type: string, description: "HH:mm:ss" }
        supplyDate:          { type: string, format: date }
        supplyEndDate:       { type: string, format: date }
        sellerData:          { $ref: '#/components/schemas/Party' }
        buyerData:           { $ref: '#/components/schemas/Party' }
        currency:            { type: string, default: SAR }
        taxCurrency:         { type: string, default: SAR }
        prepaidAmount:       { type: number, multipleOf: 0.01, default: 0 }
        originalInvoiceId:   { type: string, format: uuid, description: "Required when invoiceTypeCode ∈ {381,383}; must reference a Standard (FR-030)" }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/StandardLine' }

    Standard:
      allOf:
        - $ref: '#/components/schemas/CreateOrUpdateStandard'
        - type: object
          required: [id, status, version, chainSnapshot, totals, createdAt, updatedAt]
          properties:
            id:                 { type: string, format: uuid, readOnly: true }
            status:             { $ref: '#/components/schemas/DocumentState' }
            version:            { type: integer, format: int64, readOnly: true }
            zatcaUuid:          { type: string }
            clearanceStatus:    { type: string, description: "ZATCA-side string (CLEARED, NOT_CLEARED, IN_REVIEW, …); separate from `status` (FR-007b)" }
            zatcaResponseData:  { type: object, additionalProperties: true }
            chainSnapshot:
              type: object
              properties:
                invoiceCounterValue:   { type: integer, format: int64 }
                previousInvoiceHash:   { type: string }
                invoiceHash:           { type: string }
                qrCodeBase64:          { type: string }
            totals:
              type: object
              properties:
                lineExtensionAmount:  { type: number, multipleOf: 0.01 }
                allowanceTotalAmount: { type: number, multipleOf: 0.01 }
                taxExclusiveAmount:   { type: number, multipleOf: 0.01 }
                taxAmount:            { type: number, multipleOf: 0.01 }
                taxInclusiveAmount:   { type: number, multipleOf: 0.01 }
                payableAmount:        { type: number, multipleOf: 0.01 }
            createdAt: { type: string, format: date-time, readOnly: true }
            updatedAt: { type: string, format: date-time, readOnly: true }

    PagedStandardList:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Standard' } }
        page:  { type: integer }
        size:  { type: integer }
        total: { type: integer, format: int64 }

    SubmissionAttempt:
      type: object
      required: [id, attemptNumber, result, startedAt]
      properties:
        id:                   { type: string, format: uuid }
        attemptNumber:        { type: integer }
        chainCounterSnapshot: { type: integer, format: int64 }
        result:               { type: string, enum: [SUCCESS, REJECTED, ERROR, TIMEOUT, AMBIGUOUS] }
        errorSummary:         { type: string }
        startedAt:            { type: string, format: date-time }
        finalisedAt:          { type: string, format: date-time }
        submittedBy:          { type: string, format: uuid }

    SubmissionOutcome:
      type: object
      required: [state, attempt]
      properties:
        state:            { $ref: '#/components/schemas/DocumentState' }
        clearanceStatus:  { type: string }
        attempt:          { $ref: '#/components/schemas/SubmissionAttempt' }

    BulkStatusOutcome:
      type: object
      required: [documentId, outcome]
      properties:
        documentId: { type: string, format: uuid }
        outcome:    { type: string, enum: [ACCEPTED, REJECTED, IN_REVIEW, ERROR, CANCELLED_NO_OP] }
        clearanceStatus: { type: string }
        errorSummary:    { type: string }
        completedAt:     { type: string, format: date-time }
