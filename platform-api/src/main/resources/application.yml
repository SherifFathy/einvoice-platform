server:
  port: 8080

spring:
  application:
    name: einvoice-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholders:
      BOOTSTRAP_SUPERUSER_EMAIL: '${BOOTSTRAP_SUPERUSER_EMAIL:}'
      BOOTSTRAP_SUPERUSER_PASSWORD_HASH: '${BOOTSTRAP_SUPERUSER_PASSWORD_HASH:}'

jwt:
  secret: ${JWT_SECRET}
  ttl-seconds: ${JWT_TTL_SECONDS:28800}

encryption:
  master-key: ${ENCRYPTION_MASTER_KEY}

einvoice:
  artifacts:
    root: ${EINVOICE_ARTIFACTS_ROOT:/var/lib/einvoice/artifacts}
  integration:
    gateway-principal-id: ${GATEWAY_PRINCIPAL_ID:00000000-0000-0000-0000-000000000011}
