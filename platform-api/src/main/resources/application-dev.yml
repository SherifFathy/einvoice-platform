spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/einvoice
    username: einvoice
    password: einvoice_dev
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: false

jwt:
  secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1mb3Itand0LTEyMzQ1Ng==}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:30m}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:30d}

encryption:
  master-key: ${ENCRYPTION_MASTER_KEY:dGVzdC1tYXN0ZXIta2V5LWRldi1vbmx5LTMyYnl0ZXM=}

logging:
  level:
    com.einvoice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
