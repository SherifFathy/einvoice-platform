spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/einvoice
    username: einvoice
    password: einvoice_dev
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: false

