spring:
  datasource:
    url: ${PRODUCTION_DB_URL}
    username: ${PRODUCTION_DB_USERNAME}
    password: ${PRODUCTION_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

einvoice:
  zatca:
    base-url: https://gw-fatoora.zatca.gov.sa/e-invoicing/core
  eta:
    base-url: https://invoicing.eta.gov.eg

logging:
  level:
    com.einvoice: WARN
    org.springframework: WARN
